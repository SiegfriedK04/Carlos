services:
  mongo:
    image: mongo:8
    container_name: pokemon-battle-rooms-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: pokemon-battle-rooms-app
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/pokemon-battle-rooms
      DB_NAME: pokemon-battle-rooms
      SERVER_PORT: 3001
      CLIENT_ORIGIN: http://localhost:3000
      SEED_TARGET_ELIGIBLE: 300
    ports:
      - "3000:3000"
      - "3001:3001"

volumes:
  mongo_data:
