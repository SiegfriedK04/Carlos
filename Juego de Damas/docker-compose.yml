services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: ./services/api/Dockerfile
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/juego-damas
      AI_SERVICE_URL: http://ai:3002
    depends_on:
      - mongo
      - ai
    ports:
      - "3001:3001"

  ai:
    build:
      context: .
      dockerfile: ./services/ai/Dockerfile
    env_file:
      - .env
    ports:
      - "3002:3002"

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    env_file:
      - .env
    environment:
      VITE_API_URL: http://localhost:3001
    depends_on:
      - api
    ports:
      - "3000:3000"
